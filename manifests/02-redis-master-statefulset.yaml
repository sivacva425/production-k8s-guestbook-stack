apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-master
  namespace: production
  labels:
    app.kubernetes.io/name: redis-master
    app.kubernetes.io/component: database-primary
spec:
  serviceName: redis-master
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-master
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-master
    spec:
      containers:
      - name: master-redis
        image: redis:7.0-alpine
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        volumeMounts:
        - name: redis-data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "standard" # Use 'gp2' or 'gp3' on AWS EKS
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-master
  namespace: production
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  selector:
    app.kubernetes.io/name: redis-master
